name: CI

on:
  push:
  pull_request:
    branches: [main]
  # The sitl job is gated to pull requests because it builds ArduPilot, which
  # makes its first failure a 60-minute discovery inside a PR - the worst
  # place to find one. This adds a button, not a weaker gate: pushes still
  # skip it.
  workflow_dispatch:

# A superseded run on the same branch has nothing left to tell us.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install workspace
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format
        run: ruff format --check .

      # gateway, dispatch and airspace are safety-relevant, so a type error
      # here is a build failure rather than a warning.
      - name: mypy
        run: mypy

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install workspace
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      # Branch coverage, not line coverage. A test that passes without ever
      # executing the path it claims to cover has happened three times in this
      # repository; an unexecuted branch arc is what makes that visible.
      - name: pytest with branch coverage
        run: pytest -m 'not sitl and not slow' --cov --cov-branch --cov-report=term-missing:skip-covered --cov-report=xml

      # Ratchets, set just under the measured figures. They catch a regression;
      # they are not a target. Raise them as coverage rises.
      - name: Coverage gate - agent/
        run: coverage report --include='agent/*' --show-missing --fail-under=95

      - name: Coverage gate - tools/mavlink_probe.py
        run: coverage report --include='tools/mavlink_probe.py' --show-missing --fail-under=35

      # Slow tests need nothing external, so they belong here rather than in
      # the SITL job - a failure there would look like a SITL problem.
      - name: Slow tests
        run: pytest -m slow -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The SITL launcher and the commit-msg hook are executable code on the
      # critical path of every developer's day; they get linted too.
      - name: shellcheck
        run: shellcheck sim/run_sitl.sh sim/stop_sitl.sh .githooks/commit-msg

      - name: Scripts are executable
        run: |
          for f in sim/run_sitl.sh sim/stop_sitl.sh .githooks/commit-msg; do
            test -x "$f" || { echo "$f is not executable"; exit 1; }
          done

  compose:
    name: Dev stack reaches healthy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # P0-03's acceptance criterion, run for real: cold volumes to all four
      # services healthy. --wait fails the step if any healthcheck does not
      # pass, so no assertion is needed beyond the exit code.
      - name: make up
        run: make up

      - name: Extensions are installed
        run: |
          docker exec courier-postgres psql -U courier -d courier \
            -tAc "SELECT 1 FROM pg_extension WHERE extname = 'postgis'" | grep -q 1
          docker exec courier-timescale psql -U courier -d courier_telemetry \
            -tAc "SELECT 1 FROM pg_extension WHERE extname = 'timescaledb'" | grep -q 1

      - name: make down
        if: always()
        run: make down

  sitl:
    name: SITL integration
    # Expensive: it builds ArduPilot. Restricted to pull requests into main,
    # which is where a regression in the flight path must be caught, plus
    # manual dispatch so it can be proven green before the PR is opened.
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Pin the firmware line the fleet actually flies. When the fleet moves,
      # this moves with it — the SITL that gates merges must be the SITL that
      # matches the aircraft.
      ARDUPILOT_REF: Copter-4.5
      SITL_INSTANCE_COUNT: "3"
      # CI test area. Real operating coordinates live in configuration, never
      # in the repository; this is a simulation fixture and nothing else.
      SITL_HOME: "41.7151,44.8271,450,0"
      SITL_SYSID_BASE: "1"
      SITL_OUT_PORT_BASE: "14560"
      # No QGC in CI, so there is nothing to fan out to.
      SITL_QGC_PORT: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Checkout ArduPilot
        uses: actions/checkout@v4
        with:
          repository: ArduPilot/ardupilot
          ref: ${{ env.ARDUPILOT_REF }}
          path: ardupilot
          submodules: recursive

      - name: Record ArduPilot revision
        id: ardupilot
        working-directory: ardupilot
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache ArduPilot build
        uses: actions/cache@v4
        with:
          path: |
            ardupilot/build
            ~/.ccache
          key: ardupilot-${{ runner.os }}-${{ steps.ardupilot.outputs.sha }}
          # Without these, moving ARDUPILOT_REF throws away the ccache as well
          # as the build tree, and the next run pays the full ~20 minutes from
          # cold. A partial restore keeps the compiler cache warm, so only what
          # actually changed is rebuilt.
          restore-keys: |
            ardupilot-${{ runner.os }}-

      # The apt list comes from ArduPilot's own
      # Tools/environment_install/install-prereqs-ubuntu.sh (BASE_PKGS and
      # SITL_PKGS) on the ref this job builds, so it tracks something
      # maintained upstream rather than a list invented here.
      #
      # That script is deliberately not run directly. `-y` does make it
      # non-interactive, so interactivity is not the objection - weight is. It
      # downloads a ~100 MB ARM cross-compiler this job never uses, installs
      # SFML/CSFML, xterm, matplotlib, scipy and opencv for the desktop tools,
      # adds the user to the dialout group and edits their shell profile. For a
      # headless SITL build that is minutes of runner time for nothing.
      #
      # apt packages are deliberately not version-pinned, unlike the pip ones.
      # Runner images drop superseded versions from the archive, so an exact
      # apt pin fails on the next image bump - the opposite of the stability
      # pinning is for.
      - name: Install ArduPilot build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache g++ gawk make wget libtool libxml2-dev libxslt1-dev python3-dev

      # Pins and their reasons live in the requirements file, next to the
      # packages they apply to. The setuptools pin in particular carries the
      # condition for removing it.
      - name: Install the DroneCAN and MAVLink toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sim/requirements-ardupilot-build.txt

      - name: Build ArduCopter SITL
        working-directory: ardupilot
        run: |
          ./waf configure --board sitl
          ./waf copter

      - name: Install workspace
        run: |
          python -m pip install -e '.[dev,sitl]'

      - name: Launch SITL vehicles
        env:
          SIM_VEHICLE: ${{ github.workspace }}/ardupilot/Tools/autotest/sim_vehicle.py
        run: ./sim/run_sitl.sh -n "$SITL_INSTANCE_COUNT"

      - name: SITL integration tests
        run: pytest -m sitl -v

      - name: Stop SITL vehicles
        if: always()
        run: ./sim/stop_sitl.sh

      - name: Upload SITL logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sitl-logs
          path: sim/out/
          retention-days: 7
